<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Access &amp; Focus — placeholder module</title>
    <style>
      :root {
        --cream: #f5f3ef;
        --ink: #2c2c2a;
        --slate: #595959;
        --forest: #2a5c1e;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        color: var(--ink);
        background: var(--cream);
        padding: 2rem;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 600;
        line-height: 1.25;
      }
      p { color: var(--slate); }
      .note {
        margin-top: 2rem;
        padding: 1rem 1.25rem;
        border: 1px solid #d9d5cd;
        background: #edeae3;
        border-radius: 0.25rem;
      }
      :focus-visible {
        outline: 3px solid var(--forest);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keyboard Access &amp; Focus</h1>
      <p>
        This is a placeholder module. Replace this file with your Figma Make
        export for the Keyboard Access &amp; Focus training.
      </p>
      <div class="note">
        <p>
          Drop the built module into
          <code>public/modules/keyboard-and-focus/</code> or update
          <code>embedUrl</code> in <code>src/trainings.js</code>.
        </p>
      </div>
    </main>
  </body>
</html>
